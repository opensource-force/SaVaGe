<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {{width}} 60">
  <defs>
    <!-- Gradient for the input border -->
    <linearGradient id="inputBorderGradient{{id}}" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b46c1"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#6b46c1"/>
    </linearGradient>
    
    <!-- Subtle background gradient -->
    <linearGradient id="inputBgGradient{{id}}" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1f"/>
      <stop offset="100%" stop-color="#0f0f13"/>
    </linearGradient>
  </defs>
  
  <style>
    .auto-input-container {
      transition: all 300ms cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    .auto-input-text {
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      font-size: 18px;
      fill: #e2e8f0;
      user-select: none;
    }
    .input-cursor {
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>
  
  <!-- Container background with animated width -->
  <rect id="inputBg{{id}}" 
        x="2" y="2" 
        width="{{width}}" height="56" 
        rx="12" 
        fill="url(#inputBgGradient{{id}})"
        class="auto-input-container"/>
  
  <!-- Border with gradient -->
  <rect id="inputBorder{{id}}" 
        x="2" y="2" 
        width="{{width}}" height="56" 
        rx="12" 
        fill="none" 
        stroke="url(#inputBorderGradient{{id}})" 
        stroke-width="2"
        class="auto-input-container"/>
  
  <!-- Inner shadow effect -->
  <rect x="4" y="4" 
        width="{{width}}" height="52" 
        rx="10" 
        fill="none" 
        stroke="#000" 
        stroke-width="1" 
        opacity="0.3"
        class="auto-input-container"/>
  
  <!-- Text display area -->
  <text id="displayText{{id}}" 
        x="20" y="35" 
        class="auto-input-text">{{placeholder}}</text>
  
  <!-- Cursor -->
  <line id="cursor{{id}}" 
        x1="20" y1="20" 
        x2="20" y2="40" 
        stroke="#4ade80" 
        stroke-width="2" 
        class="input-cursor"
        style="display: none;"/>
  
  <!-- Hidden input for actual text entry -->
  <foreignObject x="0" y="0" width="1" height="1" style="overflow: hidden;">
    <input xmlns="http://www.w3.org/1999/xhtml" 
           id="hiddenInput{{id}}" 
           type="text" 
           style="position: absolute; left: -9999px;"/>
  </foreignObject>
</svg>