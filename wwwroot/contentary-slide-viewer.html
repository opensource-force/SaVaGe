<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contentary Slide Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #contentary-slide {
            max-width: 100%;
            max-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
        }

        /* Navigation Controls */
        .nav-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }

        .nav-container:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
            user-select: none;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.1);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-btn:disabled:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .slide-info {
            color: white;
            font-size: 16px;
            padding: 0 15px;
            min-width: 200px;
            text-align: center;
        }

        .slide-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .slide-counter {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Gallery Link */
        .gallery-link {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(102, 126, 234, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(102, 126, 234, 0.4);
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .gallery-link:hover {
            background: rgba(102, 126, 234, 0.4);
            border-color: rgba(102, 126, 234, 0.6);
            transform: scale(1.05);
        }

        /* Loading indicator */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 999;
        }

        /* Keyboard hint */
        .keyboard-hint {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            text-align: center;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .keyboard-hint.hidden {
            opacity: 0;
        }

        @media (max-width: 768px) {
            .nav-container {
                padding: 10px 20px;
                gap: 15px;
            }

            .nav-btn {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            .slide-info {
                min-width: 150px;
                font-size: 14px;
            }

            .gallery-link {
                top: 15px;
                right: 15px;
                padding: 8px 15px;
                font-size: 14px;
            }

            .keyboard-hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <a href="/contentary-slides-gallery.html" class="gallery-link">Gallery</a>

    <div id="loading" class="loading">Loading slide...</div>

    <div id="contentary-slide"></div>

    <div class="nav-container">
        <button class="nav-btn" id="prev-btn" title="Previous slide (←)">←</button>
        <div class="slide-info">
            <div class="slide-title" id="slide-title">Loading...</div>
            <div class="slide-counter" id="slide-counter">-/-</div>
        </div>
        <button class="nav-btn" id="next-btn" title="Next slide (→)">→</button>
    </div>

    <div class="keyboard-hint" id="keyboard-hint">
        Use ← → arrow keys to navigate
    </div>

    <script>
        // List of all contentary slides
        const slides = [
            {
                name: 'rent-a-chair-vs-spotiscription',
                title: 'rent-a-chair vs spotiscription',
                url: '/contentary-rent-a-chair-vs-spotiscription.js'
            },
            {
                name: 'biological-utility-yugen',
                title: 'Biological Utility & Yugen',
                url: '/contentary-biological-utility-yugen.js'
            },
            {
                name: 'buy-things-online',
                title: 'BUY THINGS!!!',
                url: '/contentary-buy-things-online.js'
            },
            {
                name: 'glyphenge',
                title: 'Glyphenge',
                url: '/contentary-glyphenge.js'
            }
            // Add more slides here as you create them
        ];

        let currentSlideIndex = 0;

        // Get URL parameter for initial slide
        const urlParams = new URLSearchParams(window.location.search);
        const slideParam = urlParams.get('slide');
        if (slideParam) {
            const index = slides.findIndex(s => s.name === slideParam);
            if (index !== -1) {
                currentSlideIndex = index;
            }
        }

        // Elements
        const slideContainer = document.getElementById('contentary-slide');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const slideTitle = document.getElementById('slide-title');
        const slideCounter = document.getElementById('slide-counter');
        const loading = document.getElementById('loading');
        const keyboardHint = document.getElementById('keyboard-hint');

        // Load a slide
        function loadSlide(index) {
            if (index < 0 || index >= slides.length) return;

            // Show loading
            loading.style.display = 'block';
            slideContainer.innerHTML = '';

            // Remove any existing slide scripts
            const existingScripts = document.querySelectorAll('script[data-slide-script]');
            existingScripts.forEach(script => script.remove());

            currentSlideIndex = index;
            const slide = slides[index];

            // Update UI
            slideTitle.textContent = slide.title;
            slideCounter.textContent = `${index + 1}/${slides.length}`;

            // Update URL without reload
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('slide', slide.name);
            window.history.pushState({}, '', newUrl);

            // Update button states
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === slides.length - 1;

            // Load the slide script
            const script = document.createElement('script');
            script.src = slide.url;
            script.dataset.slideScript = 'true';
            script.onload = () => {
                loading.style.display = 'none';
            };
            script.onerror = () => {
                loading.style.display = 'none';
                slideContainer.innerHTML = '<div style="color: white; text-align: center;">Error loading slide</div>';
            };
            document.body.appendChild(script);
        }

        // Navigation functions
        function nextSlide() {
            if (currentSlideIndex < slides.length - 1) {
                loadSlide(currentSlideIndex + 1);
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                loadSlide(currentSlideIndex - 1);
            }
        }

        // Event listeners
        prevBtn.addEventListener('click', prevSlide);
        nextBtn.addEventListener('click', nextSlide);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                prevSlide();
            } else if (e.key === 'ArrowRight') {
                nextSlide();
            }
        });

        // Hide keyboard hint after a few seconds
        setTimeout(() => {
            keyboardHint.classList.add('hidden');
        }, 5000);

        // Load initial slide
        loadSlide(currentSlideIndex);
    </script>
</body>
</html>
