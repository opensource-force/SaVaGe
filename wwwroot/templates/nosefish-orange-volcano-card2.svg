<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>

    <!-- ORANGE Volcano Gradient -->
    <linearGradient id="orangeVolcanoGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF7F00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="bubbleGradient">
      <stop offset="0%" style="stop-color:#B3E5FC;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4FC3F7;stop-opacity:0.2" />
    </radialGradient>

    <!-- Hat gradients -->
    <linearGradient id="hatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="hatSparkle">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Sky background -->
  <rect width="600" height="400" fill="url(#skyGradient)"/>

  <!-- Water at bottom -->
  <rect y="280" width="600" height="120" fill="#4A90E2" opacity="0.7"/>

  <!-- Sparkles around the hat area -->
  <circle cx="300" cy="180" r="3" fill="#FFD700" opacity="0.8">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="170" r="2" fill="#FFD700" opacity="0.7">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="175" r="2.5" fill="#FFD700" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.3s" repeatCount="indefinite"/>
  </circle>

  <!-- The ORANGE Volcano (on right side, looking curious) -->
  <g id="orangeVolcano">
    <!-- Mountain body - ORANGE -->
    <path d="M 420 280 L 500 140 L 580 280 Z" fill="url(#orangeVolcanoGradient)" stroke="#E65100" stroke-width="3"/>

    <!-- Crater with steam building up -->
    <ellipse cx="500" cy="140" rx="18" ry="9" fill="#D84315"/>

    <!-- More steam (pressure building) -->
    <circle cx="492" cy="115" r="10" fill="#CCCCCC" opacity="0.7">
      <animate attributeName="cy" values="115;90;70" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.4;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="508" cy="110" r="8" fill="#CCCCCC" opacity="0.6">
      <animate attributeName="cy" values="110;85;65" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="105" r="7" fill="#CCCCCC" opacity="0.5">
      <animate attributeName="cy" values="105;80;60" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Curious/interested eyes looking at the hat -->
    <ellipse cx="480" cy="200" rx="8" ry="11" fill="#2C1E18"/>
    <ellipse cx="478" cy="201" rx="4" ry="6" fill="#FF6347">
      <animate attributeName="rx" values="4;5;4" dur="2s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="520" cy="200" rx="8" ry="11" fill="#2C1E18"/>
    <ellipse cx="518" cy="201" rx="4" ry="6" fill="#FF6347">
      <animate attributeName="rx" values="4;5;4" dur="2s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Raised eyebrows (interested) -->
    <line x1="472" y1="190" x2="488" y2="188" stroke="#2C1E18" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="512" y1="188" x2="528" y2="190" stroke="#2C1E18" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Slightly hopeful smile -->
    <path d="M 485 225 Q 500 228 515 225" stroke="#2C1E18" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- The Nosefish (left side, holding out hat) -->
  <g id="nosefish">
    <!-- Hopeful bubbles -->
    <circle cx="180" cy="190" r="4" fill="url(#bubbleGradient)">
      <animate attributeName="cy" values="190;170;150" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="200" r="3" fill="url(#bubbleGradient)">
      <animate attributeName="cy" values="200;180;160" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Fish body -->
    <ellipse cx="150" cy="220" rx="35" ry="20" fill="#FF8C42" stroke="#E67332" stroke-width="2"/>

    <!-- The prominent NOSE -->
    <path d="M 115 220 L 60 218 L 65 220 L 60 222 Z"
          fill="#F4A460" stroke="#D2691E" stroke-width="1.5"/>

    <!-- Eye - looking hopeful at volcano -->
    <circle cx="135" cy="215" r="4" fill="white"/>
    <circle cx="137" cy="215" r="2" fill="black"/>

    <!-- Hopeful eyebrow -->
    <line x1="130" y1="211" x2="140" y2="210" stroke="#D2691E" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Dorsal fin -->
    <path d="M 150 200 L 145 185 L 155 200 Z" fill="#FF6B35" stroke="#E67332" stroke-width="1.5"/>

    <!-- Tail fin - gently swaying -->
    <path d="M 185 220 L 200 210 L 205 220 L 200 230 Z"
          fill="#FF6B35" stroke="#E67332" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate"
                        values="0 185 220; -5 185 220; 0 185 220; 5 185 220; 0 185 220"
                        dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Scales detail -->
    <circle cx="145" cy="220" r="3" fill="#FFB07C" opacity="0.4"/>
    <circle cx="155" cy="222" r="3" fill="#FFB07C" opacity="0.4"/>
    <circle cx="165" cy="220" r="3" fill="#FFB07C" opacity="0.4"/>
  </g>

  <!-- THE HAT - A fancy party/top hat floating between them -->
  <g id="hat" transform="translate(0, 0)">
    <!-- Hat sparkle/glow -->
    <ellipse cx="300" cy="180" rx="40" ry="35" fill="url(#hatSparkle)">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Top hat brim -->
    <ellipse cx="300" cy="190" rx="35" ry="8" fill="#6A1B9A" stroke="#4A148C" stroke-width="2"/>

    <!-- Top hat body -->
    <rect x="270" y="150" width="60" height="40" fill="url(#hatGradient)" stroke="#4A148C" stroke-width="2" rx="3"/>

    <!-- Hat top -->
    <ellipse cx="300" cy="150" rx="30" ry="7" fill="#8E24AA" stroke="#4A148C" stroke-width="2"/>

    <!-- Hat band with bow -->
    <rect x="270" y="175" width="60" height="8" fill="#FFD700" stroke="#FFA000" stroke-width="1"/>

    <!-- Little bow on hat -->
    <path d="M 285 179 L 280 175 L 285 171 L 280 179 L 285 187 L 280 183 Z"
          fill="#FF6B6B" stroke="#D63031" stroke-width="1"/>
    <path d="M 315 179 L 320 175 L 315 171 L 320 179 L 315 187 L 320 183 Z"
          fill="#FF6B6B" stroke="#D63031" stroke-width="1"/>

    <!-- Gentle floating animation -->
    <animateTransform attributeName="transform" type="translate"
                      values="0,0; 0,-5; 0,0; 0,5; 0,0"
                      dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- Arrow pointing from nosefish to hat -->
  <g id="offeringArrow" opacity="0.5">
    <path d="M 190 215 L 260 185" stroke="#34495E" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#34495E" />
      </marker>
    </defs>
  </g>

  <!-- Story text at bottom -->
  <text x="300" y="340" font-family="Georgia, serif" font-size="22" font-weight="bold"
        text-anchor="middle" fill="#2C3E50" stroke="#ECF0F1" stroke-width="0.5">
    "Maybe this hat will help!"
  </text>
  <text x="300" y="370" font-family="Georgia, serif" font-size="18"
        text-anchor="middle" fill="#34495E">
    The nosefish offered the volcano a beautiful purple hat.
  </text>
</svg>
