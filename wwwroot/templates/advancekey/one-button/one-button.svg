<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100">
  <defs>
    <!-- Gradient for button background -->
    <linearGradient id="buttonGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:{{buttonColor1}};stop-opacity:1" />
      <stop offset="100%" style="stop-color:{{buttonColor2}};stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter for hover effect -->
    <filter id="buttonGlow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feFlood flood-color="{{buttonColor1}}" flood-opacity="0.8"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .button-rect {
      fill: url(#buttonGradient1);
      stroke: {{buttonColor1}};
      stroke-width: 2;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .button-rect:hover {
      filter: url(#buttonGlow1);
    }
    .button-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: {{fontSize}};
      font-weight: bold;
      fill: white;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
  </style>

  <!-- Single centered button -->
  <rect
    class="button-rect"
    id="button1"
    x="50"
    y="20"
    width="300"
    height="60"
    rx="12"
    data-spell="{{spell1}}"
    data-spell-component="{{spellComponent1}}"
  />
  <text class="button-text" x="200" y="50">{{buttonText1}}</text>
</svg>
