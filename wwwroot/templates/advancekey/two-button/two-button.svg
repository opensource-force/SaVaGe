<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100">
  <defs>
    <!-- Gradients for button backgrounds -->
    <linearGradient id="buttonGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:{{buttonColor1}};stop-opacity:1" />
      <stop offset="100%" style="stop-color:{{buttonColor2}};stop-opacity:1" />
    </linearGradient>

    <linearGradient id="buttonGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:{{buttonColor3}};stop-opacity:1" />
      <stop offset="100%" style="stop-color:{{buttonColor4}};stop-opacity:1" />
    </linearGradient>

    <!-- Glow filters for hover effects -->
    <filter id="buttonGlow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feFlood flood-color="{{buttonColor1}}" flood-opacity="0.8"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="buttonGlow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feFlood flood-color="{{buttonColor3}}" flood-opacity="0.8"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .button-rect {
      stroke-width: 2;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .button1 {
      fill: url(#buttonGradient1);
      stroke: {{buttonColor1}};
    }
    .button1:hover {
      filter: url(#buttonGlow1);
    }
    .button2 {
      fill: url(#buttonGradient2);
      stroke: {{buttonColor3}};
    }
    .button2:hover {
      filter: url(#buttonGlow2);
    }
    .button-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: {{fontSize}};
      font-weight: bold;
      fill: white;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
  </style>

  <!-- Two buttons side by side -->
  <!-- Button 1 (Left) -->
  <rect
    class="button-rect button1"
    id="button1"
    x="20"
    y="20"
    width="175"
    height="60"
    rx="12"
    data-spell="{{spell1}}"
    data-spell-component="{{spellComponent1}}"
  />
  <text class="button-text" x="107.5" y="50">{{buttonText1}}</text>

  <!-- Button 2 (Right) -->
  <rect
    class="button-rect button2"
    id="button2"
    x="205"
    y="20"
    width="175"
    height="60"
    rx="12"
    data-spell="{{spell2}}"
    data-spell-component="{{spellComponent2}}"
  />
  <text class="button-text" x="292.5" y="50">{{buttonText2}}</text>
</svg>
