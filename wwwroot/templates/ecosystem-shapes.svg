<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE66D;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44A08D;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A8DADC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#457B9D;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F1FAEE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8DADC;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F77F00;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9D4EDD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C77DFF;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06FFA5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4EC5D4;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD60A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC300;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B5179E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F72585;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="radialGrad1">
      <stop offset="0%" style="stop-color:#FF9E00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF5E00;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="radialGrad2">
      <stop offset="0%" style="stop-color:#56CCF2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2F80ED;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="radialGrad3">
      <stop offset="0%" style="stop-color:#7B2CBF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A189A;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#F8F9FA"/>

  <!-- Scattered decorative elements -->
  <circle cx="100" cy="100" r="3" fill="#CED4DA" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="150" r="2" fill="#CED4DA" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="700" r="2.5" fill="#CED4DA" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- 1. Portland - Large Circle -->
  <g transform="translate(150, 120)">
    <circle cx="0" cy="0" r="70" fill="url(#grad1)" stroke="#343A40" stroke-width="3">
      <animate attributeName="r" values="70;73;70" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Portland</text>
  </g>

  <!-- 2. PopupsPlease - Rectangle -->
  <g transform="translate(350, 90)">
    <rect x="-80" y="-35" width="160" height="70" rx="8" fill="url(#grad2)" stroke="#343A40" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" values="0;2;-2;0" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">PopupsPlease</text>
  </g>

  <!-- 3. PeaPod - Ellipse -->
  <g transform="translate(600, 130)">
    <ellipse cx="0" cy="0" rx="75" ry="50" fill="url(#grad3)" stroke="#343A40" stroke-width="2.5">
      <animate attributeName="ry" values="50;53;50" dur="3.5s" repeatCount="indefinite"/>
    </ellipse>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">PeaPod</text>
  </g>

  <!-- 4. PLR - Hexagon -->
  <g transform="translate(800, 100)">
    <path d="M 0,-50 L 43,-25 L 43,25 L 0,50 L -43,25 L -43,-25 Z" fill="url(#grad4)" stroke="#343A40" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="20s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#343A40">PLR</text>
  </g>

  <!-- 5. RCSF - Diamond -->
  <g transform="translate(980, 140)">
    <path d="M 0,-55 L 55,0 L 0,55 L -55,0 Z" fill="url(#grad5)" stroke="#343A40" stroke-width="2.5">
      <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">RCSF</text>
  </g>

  <!-- 6. Mirlo - Circle -->
  <g transform="translate(120, 300)">
    <circle cx="0" cy="0" r="60" fill="url(#grad6)" stroke="#343A40" stroke-width="2.5">
      <animate attributeName="r" values="60;63;60" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Mirlo</text>
  </g>

  <!-- 7. Fledge - Pentagon -->
  <g transform="translate(300, 280)">
    <path d="M 0,-55 L 52,-17 L 32,45 L -32,45 L -52,-17 Z" fill="url(#grad7)" stroke="#343A40" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;-360 0 0" dur="25s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF">Fledge</text>
  </g>

  <!-- 8. Swedemom - Rounded Rectangle -->
  <g transform="translate(520, 280)">
    <rect x="-85" y="-40" width="170" height="80" rx="15" fill="url(#grad8)" stroke="#343A40" stroke-width="2.5">
      <animate attributeName="rx" values="15;20;15" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#343A40">Swedemom</text>
  </g>

  <!-- 9. Hitchhiker's - Star -->
  <g transform="translate(760, 270)">
    <path d="M 0,-60 L 14,-18 L 58,-18 L 23,8 L 36,50 L 0,24 L -36,50 L -23,8 L -58,-18 L -14,-18 Z"
          fill="url(#radialGrad1)" stroke="#343A40" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="15s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Hitchhiker's</text>
  </g>

  <!-- 10. RelocalizeCreativity - Large Rectangle -->
  <g transform="translate(1020, 270)">
    <rect x="-95" y="-45" width="190" height="90" rx="10" fill="url(#grad9)" stroke="#343A40" stroke-width="2.5">
      <animateTransform attributeName="transform" type="skewX" values="0;3;-3;0" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Relocalize</text>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Creativity</text>
  </g>

  <!-- 11. Fedwiki - Octagon -->
  <g transform="translate(150, 480)">
    <path d="M -35,-50 L 35,-50 L 50,-35 L 50,35 L 35,50 L -35,50 L -50,35 L -50,-35 Z"
          fill="url(#radialGrad2)" stroke="#343A40" stroke-width="2.5">
      <animate attributeName="opacity" values="1;0.85;1" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Fedwiki</text>
  </g>

  <!-- 12. Open Source Force - Large Ellipse -->
  <g transform="translate(380, 470)">
    <ellipse cx="0" cy="0" rx="95" ry="60" fill="url(#grad1)" stroke="#343A40" stroke-width="2.5">
      <animate attributeName="rx" values="95;98;95" dur="3.8s" repeatCount="indefinite"/>
    </ellipse>
    <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">Open Source</text>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">Force</text>
  </g>

  <!-- 13. Binding Chaos - Triangle -->
  <g transform="translate(620, 460)">
    <path d="M 0,-65 L 75,55 L -75,55 Z" fill="url(#grad2)" stroke="#343A40" stroke-width="2.5">
      <animate attributeName="opacity" values="1;0.9;1" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Binding</text>
    <text x="0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Chaos</text>
  </g>

  <!-- 14. Homeventory - Circle -->
  <g transform="translate(850, 480)">
    <circle cx="0" cy="0" r="65" fill="url(#grad3)" stroke="#343A40" stroke-width="2.5">
      <animate attributeName="r" values="65;68;65" dur="3.3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">Home</text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">ventory</text>
  </g>

  <!-- 15. Techne Legalis - Hexagon -->
  <g transform="translate(1050, 460)">
    <path d="M 0,-55 L 48,-27 L 48,27 L 0,55 L -48,27 L -48,-27 Z" fill="url(#grad4)" stroke="#343A40" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;360 0 0" dur="18s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#343A40">Techne</text>
    <text x="0" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#343A40">Legalis</text>
  </g>

  <!-- 16. Clean Haus - Rounded Square -->
  <g transform="translate(200, 660)">
    <rect x="-60" y="-60" width="120" height="120" rx="20" fill="url(#grad5)" stroke="#343A40" stroke-width="2.5">
      <animate attributeName="rx" values="20;25;20" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Clean</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Haus</text>
  </g>

  <!-- 17. GSm - Small Diamond -->
  <g transform="translate(450, 670)">
    <path d="M 0,-50 L 50,0 L 0,50 L -50,0 Z" fill="url(#grad6)" stroke="#343A40" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;-360 0 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">GSm</text>
  </g>

  <!-- 18. More! - Star Burst -->
  <g transform="translate(700, 660)">
    <circle cx="0" cy="0" r="70" fill="url(#radialGrad3)" stroke="#343A40" stroke-width="3">
      <animate attributeName="r" values="70;75;70" dur="2s" repeatCount="indefinite"/>
    </circle>
    <path d="M 0,-70 L 0,-90 M 0,70 L 0,90 M -70,0 L -90,0 M 70,0 L 90,0
             M -50,-50 L -65,-65 M 50,50 L 65,65 M 50,-50 L 65,-65 M -50,50 L -65,65"
          stroke="#C77DFF" stroke-width="4" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF">More!</text>
  </g>

  <!-- Connecting lines (optional decorative element) -->
  <g opacity="0.15">
    <line x1="150" y1="120" x2="350" y2="90" stroke="#343A40" stroke-width="1"/>
    <line x1="350" y1="90" x2="600" y2="130" stroke="#343A40" stroke-width="1"/>
    <line x1="600" y1="130" x2="800" y2="100" stroke="#343A40" stroke-width="1"/>
    <line x1="120" y1="300" x2="300" y2="280" stroke="#343A40" stroke-width="1"/>
    <line x1="300" y1="280" x2="520" y2="280" stroke="#343A40" stroke-width="1"/>
    <line x1="520" y1="280" x2="760" y2="270" stroke="#343A40" stroke-width="1"/>
    <line x1="150" y1="480" x2="380" y2="470" stroke="#343A40" stroke-width="1"/>
    <line x1="380" y1="470" x2="620" y2="460" stroke="#343A40" stroke-width="1"/>
    <line x1="620" y1="460" x2="850" y2="480" stroke="#343A40" stroke-width="1"/>
  </g>
</svg>
