<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>

    <!-- ORANGE Volcano Gradient -->
    <linearGradient id="orangeVolcanoGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF7F00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6500;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="lavaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF6347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC143C;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="bubbleGradient">
      <stop offset="0%" style="stop-color:#B3E5FC;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4FC3F7;stop-opacity:0.2" />
    </radialGradient>

    <!-- Warning glow -->
    <radialGradient id="warningGlow">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Sky background -->
  <rect width="600" height="400" fill="url(#skyGradient)"/>

  <!-- Water at bottom -->
  <rect y="280" width="600" height="120" fill="#4A90E2" opacity="0.7"/>

  <!-- Warning glow around scene -->
  <ellipse cx="300" cy="200" rx="250" ry="180" fill="url(#warningGlow)">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- The ORANGE Volcano (on right side) -->
  <g id="orangeVolcano">
    <!-- Mountain body - ORANGE -->
    <path d="M 420 280 L 500 140 L 580 280 Z" fill="url(#orangeVolcanoGradient)" stroke="#E65100" stroke-width="3"/>

    <!-- Crater -->
    <ellipse cx="500" cy="140" rx="18" ry="9" fill="#D84315"/>

    <!-- Slight smoke/steam (not fully erupting yet) -->
    <circle cx="495" cy="120" r="8" fill="#CCCCCC" opacity="0.6">
      <animate attributeName="cy" values="120;100;80" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="505" cy="115" r="6" fill="#CCCCCC" opacity="0.5">
      <animate attributeName="cy" values="115;95;75" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Worried/upset eyes -->
    <ellipse cx="480" cy="200" rx="7" ry="10" fill="#2C1E18"/>
    <ellipse cx="480" cy="201" rx="3" ry="5" fill="#FF6347">
      <animate attributeName="ry" values="5;2;5" dur="2s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="520" cy="200" rx="7" ry="10" fill="#2C1E18"/>
    <ellipse cx="520" cy="201" rx="3" ry="5" fill="#FF6347">
      <animate attributeName="ry" values="5;2;5" dur="2s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Stressed eyebrows -->
    <line x1="473" y1="192" x2="487" y2="195" stroke="#2C1E18" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="513" y1="195" x2="527" y2="192" stroke="#2C1E18" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Frowning mouth -->
    <path d="M 485 225 Q 500 220 515 225" stroke="#2C1E18" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- The Nosefish (left side, gesturing/warning) -->
  <g id="nosefish">
    <!-- Concerned bubbles -->
    <circle cx="180" cy="190" r="4" fill="url(#bubbleGradient)">
      <animate attributeName="cy" values="190;170;150" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="200" r="3" fill="url(#bubbleGradient)">
      <animate attributeName="cy" values="200;180;160" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Fish body -->
    <ellipse cx="150" cy="220" rx="35" ry="20" fill="#FF8C42" stroke="#E67332" stroke-width="2"/>

    <!-- The prominent NOSE (pointing toward volcano) -->
    <path d="M 115 220 L 60 218 L 65 220 L 60 222 Z"
          fill="#F4A460" stroke="#D2691E" stroke-width="1.5">
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; -5,0; 0,0"
                        dur="1.5s" repeatCount="indefinite"/>
    </path>

    <!-- Eye - looking worried at volcano -->
    <circle cx="135" cy="215" r="4" fill="white"/>
    <circle cx="137" cy="215" r="2" fill="black"/>

    <!-- Concerned eyebrow -->
    <line x1="130" y1="210" x2="140" y2="211" stroke="#D2691E" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Dorsal fin -->
    <path d="M 150 200 L 145 185 L 155 200 Z" fill="#FF6B35" stroke="#E67332" stroke-width="1.5"/>

    <!-- Tail fin - nervous swishing -->
    <path d="M 185 220 L 200 210 L 205 220 L 200 230 Z"
          fill="#FF6B35" stroke="#E67332" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate"
                        values="0 185 220; -8 185 220; 0 185 220; 8 185 220; 0 185 220"
                        dur="1.5s" repeatCount="indefinite"/>
    </path>

    <!-- Pectoral fin - raised as if gesturing "stop" -->
    <ellipse cx="175" cy="210" rx="12" ry="8" fill="#FF6B35" opacity="0.9"
             transform="rotate(-45 175 210)">
      <animateTransform attributeName="transform" type="rotate"
                        values="-45 175 210; -50 175 210; -45 175 210"
                        dur="1.2s" repeatCount="indefinite" additive="sum"/>
    </ellipse>

    <!-- Scales detail -->
    <circle cx="145" cy="220" r="3" fill="#FFB07C" opacity="0.4"/>
    <circle cx="155" cy="222" r="3" fill="#FFB07C" opacity="0.4"/>
    <circle cx="165" cy="220" r="3" fill="#FFB07C" opacity="0.4"/>
  </g>

  <!-- Exclamation marks showing urgency -->
  <g id="warnings" opacity="0.7">
    <text x="280" y="150" font-family="Arial, sans-serif" font-size="30" font-weight="bold"
          fill="#FF4500" stroke="#FFD700" stroke-width="1">
      !
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
    </text>
    <text x="350" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
          fill="#FF4500" stroke="#FFD700" stroke-width="0.8">
      !
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Story text at bottom -->
  <text x="300" y="340" font-family="Georgia, serif" font-size="22" font-weight="bold"
        text-anchor="middle" fill="#2C3E50" stroke="#ECF0F1" stroke-width="0.5">
    "Please don't explode!"
  </text>
  <text x="300" y="370" font-family="Georgia, serif" font-size="18"
        text-anchor="middle" fill="#34495E">
    said the nosefish to the orange volcano.
  </text>
</svg>
