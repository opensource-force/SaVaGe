<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <!-- CONTENTARY SLIDE: Glyphenge - The Link Enchantment -->
  <!-- Mystical, ethereal aesthetic for link management -->

  <defs>
    <!-- Deep mystical background gradient -->
    <linearGradient id="mysticalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1a1b3d;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#2d1b4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0b2e;stop-opacity:1" />
    </linearGradient>

    <!-- Ethereal purple gradient -->
    <linearGradient id="etherealPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c39dff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9d6dff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a3dff;stop-opacity:1" />
    </linearGradient>

    <!-- Mystical cyan gradient -->
    <linearGradient id="mysticalCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>

    <!-- Enchantment glow gradient -->
    <radialGradient id="enchantmentGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="30%" style="stop-color:#c39dff;stop-opacity:0.6" />
      <stop offset="60%" style="stop-color:#7a3dff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1a0b2e;stop-opacity:0" />
    </radialGradient>

    <!-- Tapestry pattern -->
    <pattern id="tapestryPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 0,30 Q 15,20 30,30 T 60,30" fill="none" stroke="#7a3dff" stroke-width="0.5" opacity="0.2"/>
      <path d="M 30,0 Q 20,15 30,30 T 30,60" fill="none" stroke="#7a3dff" stroke-width="0.5" opacity="0.2"/>
      <circle cx="30" cy="30" r="2" fill="#c39dff" opacity="0.3"/>
    </pattern>

    <!-- Mystical glow filter -->
    <filter id="mysticalGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Ethereal glow -->
    <filter id="etherealGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow for symbols -->
    <filter id="symbolGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#mysticalBg)"/>
  <rect width="1080" height="1920" fill="url(#tapestryPattern)"/>

  <!-- Floating mystical particles -->
  <g opacity="0.6">
    <circle cx="200" cy="300" r="3" fill="#c39dff">
      <animate attributeName="cy" values="300;280;300" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="500" r="2" fill="#00d4ff">
      <animate attributeName="cy" values="500;480;500" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="800" r="2.5" fill="#c39dff">
      <animate attributeName="cy" values="800;785;800" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="1200" r="3" fill="#00d4ff">
      <animate attributeName="cy" values="1200;1180;1200" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="1500" r="2" fill="#c39dff">
      <animate attributeName="cy" values="1500;1485;1500" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Central enchantment circle -->
  <g transform="translate(540, 480)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="url(#etherealPurple)" stroke-width="2"
            opacity="0.4" filter="url(#etherealGlow)">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="60s" repeatCount="indefinite"/>
    </circle>

    <!-- Middle ring with runes -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#mysticalCyan)" stroke-width="1.5"
            opacity="0.5" stroke-dasharray="10,5">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="-360 0 0" dur="45s" repeatCount="indefinite"/>
    </circle>

    <!-- Inner glow -->
    <circle cx="0" cy="0" r="120" fill="url(#enchantmentGlow)" opacity="0.3"/>

    <!-- Center symbol - abstract link/chain -->
    <g>
      <ellipse cx="-30" cy="0" rx="35" ry="50" fill="none" stroke="url(#etherealPurple)"
               stroke-width="6" filter="url(#symbolGlow)"/>
      <ellipse cx="30" cy="0" rx="35" ry="50" fill="none" stroke="url(#mysticalCyan)"
               stroke-width="6" filter="url(#symbolGlow)"/>
      <rect x="-15" y="-8" width="30" height="16" fill="url(#etherealPurple)" opacity="0.8"/>
    </g>

    <!-- Runic decorations around circle -->
    <g opacity="0.7">
      <text x="0" y="-180" font-family="serif" font-size="24" fill="url(#etherealPurple)"
            text-anchor="middle" filter="url(#etherealGlow)">✦</text>
      <text x="127" y="-127" font-family="serif" font-size="24" fill="url(#mysticalCyan)"
            text-anchor="middle" filter="url(#etherealGlow)">✧</text>
      <text x="180" y="0" font-family="serif" font-size="24" fill="url(#etherealPurple)"
            text-anchor="middle" filter="url(#etherealGlow)">✦</text>
      <text x="127" y="127" font-family="serif" font-size="24" fill="url(#mysticalCyan)"
            text-anchor="middle" filter="url(#etherealGlow)">✧</text>
      <text x="0" y="180" font-family="serif" font-size="24" fill="url(#etherealPurple)"
            text-anchor="middle" filter="url(#etherealGlow)">✦</text>
      <text x="-127" y="127" font-family="serif" font-size="24" fill="url(#mysticalCyan)"
            text-anchor="middle" filter="url(#etherealGlow)">✧</text>
      <text x="-180" y="0" font-family="serif" font-size="24" fill="url(#etherealPurple)"
            text-anchor="middle" filter="url(#etherealGlow)">✦</text>
      <text x="-127" y="-127" font-family="serif" font-size="24" fill="url(#mysticalCyan)"
            text-anchor="middle" filter="url(#etherealGlow)">✧</text>
    </g>
  </g>

  <!-- Title -->
  <text x="540" y="180" font-family="Georgia, serif" font-size="80" font-weight="300"
        fill="url(#etherealPurple)" text-anchor="middle" filter="url(#mysticalGlow)"
        letter-spacing="8">
    GLYPHENGE
  </text>

  <!-- Subtitle decoration -->
  <line x1="300" y1="210" x2="780" y2="210" stroke="url(#mysticalCyan)" stroke-width="1" opacity="0.5"/>

  <!-- Tagline -->
  <text x="540" y="260" font-family="Georgia, serif" font-size="32" font-style="italic"
        fill="url(#mysticalCyan)" text-anchor="middle" opacity="0.9">
    The Link Enchantment
  </text>

  <!-- Live Tapestry Embed -->
  <text x="540" y="800" font-family="Georgia, serif" font-size="32" font-weight="600"
        fill="url(#etherealPurple)" text-anchor="middle" filter="url(#etherealGlow)">
    Live Link Tapestry
  </text>

  <!-- Glowing frame for the embed -->
  <rect x="140" y="830" width="800" height="450" rx="20"
        fill="rgba(10, 14, 39, 0.8)" stroke="url(#etherealPurple)" stroke-width="3"
        filter="url(#mysticalGlow)"/>

  <!-- Tapestry Screenshot -->
  <image x="160" y="850" width="760" height="410"
         href="/assets/glyphenge.png"
         preserveAspectRatio="xMidYMid slice"
         style="border-radius: 15px;"/>

  <!-- Subtle overlay for depth -->
  <rect x="160" y="850" width="760" height="410" rx="15"
        fill="url(#enchantmentGlow)" opacity="0.05"/>

  <!-- Corner decorations around embed -->
  <text x="160" y="860" font-family="serif" font-size="24" fill="url(#mysticalCyan)"
        opacity="0.6">✧</text>
  <text x="900" y="860" font-family="serif" font-size="24" fill="url(#etherealPurple)"
        opacity="0.6">✦</text>
  <text x="160" y="1250" font-family="serif" font-size="24" fill="url(#etherealPurple)"
        opacity="0.6">✦</text>
  <text x="900" y="1250" font-family="serif" font-size="24" fill="url(#mysticalCyan)"
        opacity="0.6">✧</text>

  <!-- Description box -->
  <rect x="140" y="1310" width="800" height="120" rx="20"
        fill="rgba(122, 61, 255, 0.1)" stroke="url(#etherealPurple)" stroke-width="2"
        filter="url(#etherealGlow)"/>

  <text x="540" y="1360" font-family="Georgia, serif" font-size="24" font-weight="300"
        fill="#c39dff" text-anchor="middle">
    Cast the enchantment to weave your personal tapestry
  </text>

  <text x="540" y="1405" font-family="Georgia, serif" font-size="20" font-style="italic"
        fill="url(#mysticalCyan)" text-anchor="middle" opacity="0.8">
    Cryptographically secure • Privacy-first • Beautifully mystical
  </text>

  <!-- Call to action -->
  <g transform="translate(540, 1450)">
    <rect x="-200" y="-45" width="400" height="90" rx="45"
          fill="rgba(122, 61, 255, 0.2)" stroke="url(#etherealPurple)" stroke-width="3"
          filter="url(#mysticalGlow)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="15" font-family="Georgia, serif" font-size="36" font-weight="600"
          fill="url(#mysticalCyan)" text-anchor="middle" filter="url(#etherealGlow)">
      Enter the Emporium
    </text>
  </g>

  <!-- Bottom mystical elements -->
  <g transform="translate(540, 1650)">
    <!-- Connecting lines -->
    <path d="M -150,0 L -50,-30 L 0,0 L 50,-30 L 150,0" fill="none"
          stroke="url(#etherealPurple)" stroke-width="1" opacity="0.3"/>

    <!-- Decorative symbols -->
    <circle cx="-150" cy="0" r="4" fill="url(#mysticalCyan)"/>
    <circle cx="-50" cy="-30" r="3" fill="url(#etherealPurple)"/>
    <circle cx="0" cy="0" r="5" fill="url(#mysticalCyan)"/>
    <circle cx="50" cy="-30" r="3" fill="url(#etherealPurple)"/>
    <circle cx="150" cy="0" r="4" fill="url(#mysticalCyan)"/>
  </g>

  <!-- Footer -->
  <text x="540" y="1780" font-family="Georgia, serif" font-size="24"
        fill="#7a3dff" text-anchor="middle" opacity="0.6">
    Part of The Advancement
  </text>

  <text x="540" y="1830" font-family="Georgia, serif" font-size="20" font-style="italic"
        fill="#00d4ff" text-anchor="middle" opacity="0.5">
    by Planet Nine
  </text>

  <!-- Ambient sparkles -->
  <g opacity="0.4">
    <circle cx="150" cy="950" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="1100" r="1.5" fill="#c39dff">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="1400" r="2" fill="#00d4ff">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="1550" r="1.5" fill="#ffffff">
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
