<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <!-- GLASS MORPHISM SHOWCASE: Demonstrates modern glass effects with blur and transparency -->

  <defs>
    <!-- Backdrop Blur Filter -->
    <filter id="glassBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>

    <!-- Stronger Blur for Frosted Glass -->
    <filter id="frostedGlass">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>

    <!-- Light Blur for Subtle Glass -->
    <filter id="subtleGlass">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>

    <!-- Gradient for Glass Shine -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.2" />
    </linearGradient>

    <!-- Radial Gradient for Glow -->
    <radialGradient id="glassGlow">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.2" />
    </linearGradient>

    <!-- Colorful Background Gradient -->
    <linearGradient id="colorfulBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="50%" style="stop-color:#764ba2"/>
      <stop offset="100%" style="stop-color:#f093fb"/>
    </linearGradient>

    <!-- Mesh Pattern for Background -->
    <pattern id="meshPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="50" cy="50" r="40" fill="#ffffff" opacity="0.05"/>
      <circle cx="0" cy="0" r="30" fill="#ffffff" opacity="0.03"/>
      <circle cx="100" cy="100" r="30" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Colorful Background -->
  <rect width="1080" height="1920" fill="url(#colorfulBg)"/>
  <rect width="1080" height="1920" fill="url(#meshPattern)"/>

  <!-- Decorative Background Circles -->
  <circle cx="200" cy="300" r="150" fill="#ff6b6b" opacity="0.3"/>
  <circle cx="880" cy="500" r="200" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="300" cy="900" r="180" fill="#ffe66d" opacity="0.25"/>
  <circle cx="800" cy="1200" r="220" fill="#95e1d3" opacity="0.3"/>
  <circle cx="400" cy="1600" r="160" fill="#ff6b9d" opacity="0.25"/>

  <!-- Title -->
  <text x="540" y="100" font-family="Arial, sans-serif" font-size="56" font-weight="bold"
        fill="#ffffff" text-anchor="middle" style="text-shadow: 0 2px 20px rgba(0,0,0,0.3);">
    GLASS MORPHISM
  </text>

  <text x="540" y="160" font-family="Arial, sans-serif" font-size="24"
        fill="#ffffff" opacity="0.9" text-anchor="middle">
    Modern Blur &amp; Transparency Effects
  </text>

  <!-- Example 1: Basic Glass Card -->
  <g transform="translate(540, 300)">
    <!-- Glass background -->
    <rect x="-180" y="-80" width="360" height="160" rx="20"
          fill="#ffffff" opacity="0.15"/>
    <rect x="-180" y="-80" width="360" height="160" rx="20"
          fill="none" stroke="url(#glassBorder)" stroke-width="1.5"/>
    <!-- Shine effect -->
    <rect x="-180" y="-80" width="360" height="160" rx="20"
          fill="url(#glassShine)"/>

    <text x="0" y="-20" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
          fill="#ffffff" text-anchor="middle">Basic Glass</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="16"
          fill="#ffffff" opacity="0.8" text-anchor="middle">15% opacity + border</text>
  </g>

  <!-- Example 2: Frosted Glass Card -->
  <g transform="translate(270, 550)">
    <!-- Frosted background -->
    <rect x="-120" y="-120" width="240" height="240" rx="25"
          fill="#ffffff" opacity="0.1"/>
    <rect x="-120" y="-120" width="240" height="240" rx="25"
          fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="-120" y="-120" width="240" height="240" rx="25"
          fill="url(#glassShine)"/>

    <circle cx="0" cy="-30" r="35" fill="#ffffff" opacity="0.3"/>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
          fill="#ffffff" text-anchor="middle">Frosted</text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="14"
          fill="#ffffff" opacity="0.7" text-anchor="middle">Strong blur</text>
  </g>

  <!-- Example 3: Colored Glass Card -->
  <g transform="translate(810, 550)">
    <!-- Colored glass -->
    <rect x="-120" y="-120" width="240" height="240" rx="25"
          fill="#4ecdc4" opacity="0.2"/>
    <rect x="-120" y="-120" width="240" height="240" rx="25"
          fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="-120" y="-120" width="240" height="240" rx="25"
          fill="url(#glassShine)"/>

    <circle cx="0" cy="-30" r="35" fill="#ffffff" opacity="0.4"/>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
          fill="#ffffff" text-anchor="middle">Colored</text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="14"
          fill="#ffffff" opacity="0.7" text-anchor="middle">Tinted glass</text>
  </g>

  <!-- Example 4: Large Glass Panel -->
  <g transform="translate(540, 900)">
    <rect x="-380" y="-150" width="760" height="300" rx="30"
          fill="#ffffff" opacity="0.12"/>
    <rect x="-380" y="-150" width="760" height="300" rx="30"
          fill="none" stroke="url(#glassBorder)" stroke-width="2"/>
    <rect x="-380" y="-150" width="760" height="300" rx="30"
          fill="url(#glassShine)"/>

    <!-- Content inside glass -->
    <text x="0" y="-70" font-family="Arial, sans-serif" font-size="36" font-weight="bold"
          fill="#ffffff" text-anchor="middle">Premium Glass Panel</text>
    <text x="0" y="-20" font-family="Arial, sans-serif" font-size="18"
          fill="#ffffff" opacity="0.8" text-anchor="middle">
      Multi-layer transparency effect
    </text>

    <!-- Button inside glass -->
    <rect x="-100" y="30" width="200" height="50" rx="25"
          fill="#ffffff" opacity="0.2"/>
    <rect x="-100" y="30" width="200" height="50" rx="25"
          fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="0" y="63" font-family="Arial, sans-serif" font-size="18" font-weight="bold"
          fill="#ffffff" text-anchor="middle">Click Me</text>
  </g>

  <!-- Example 5: Glass Card with Icon -->
  <g transform="translate(270, 1300)">
    <rect x="-120" y="-140" width="240" height="280" rx="20"
          fill="#ffffff" opacity="0.15"/>
    <rect x="-120" y="-140" width="240" height="280" rx="20"
          fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="-120" y="-140" width="240" height="280" rx="20"
          fill="url(#glassShine)"/>

    <!-- Icon -->
    <circle cx="0" cy="-50" r="40" fill="#ffffff" opacity="0.25"/>
    <path d="M -15,-60 L 15,-60 L 15,-40 L -15,-40 Z M -10,-35 L 10,-35 L 10,-15 L -10,-15 Z"
          fill="#ffffff" opacity="0.7"/>

    <text x="0" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
          fill="#ffffff" text-anchor="middle">Dashboard</text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="14"
          fill="#ffffff" opacity="0.7" text-anchor="middle">View stats</text>
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="14"
          fill="#ffffff" opacity="0.7" text-anchor="middle">and analytics</text>
  </g>

  <!-- Example 6: Circular Glass -->
  <g transform="translate(810, 1300)">
    <circle cx="0" cy="0" r="120" fill="#ffffff" opacity="0.15"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="0" cy="0" r="120" fill="url(#glassGlow)"/>

    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
          fill="#ffffff" text-anchor="middle">99+</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="16"
          fill="#ffffff" opacity="0.8" text-anchor="middle">Messages</text>
  </g>

  <!-- Code Example Section -->
  <rect x="90" y="1550" width="900" height="330" rx="20"
        fill="#ffffff" opacity="0.1"/>
  <rect x="90" y="1550" width="900" height="330" rx="20"
        fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>

  <text x="540" y="1610" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
        fill="#ffffff" text-anchor="middle">
    Glass Effect Code:
  </text>

  <text x="130" y="1660" font-family="Courier, monospace" font-size="16" fill="#ffffff">
    &lt;!-- Glass background --&gt;
  </text>
  <text x="130" y="1690" font-family="Courier, monospace" font-size="16" fill="#4ecdc4">
    &lt;rect fill="#ffffff" opacity="0.15"
  </text>
  <text x="170" y="1720" font-family="Courier, monospace" font-size="16" fill="#4ecdc4">
    rx="20"/&gt;
  </text>
  <text x="130" y="1755" font-family="Courier, monospace" font-size="16" fill="#ffffff">
    &lt;!-- Border for definition --&gt;
  </text>
  <text x="130" y="1785" font-family="Courier, monospace" font-size="16" fill="#95e1d3">
    &lt;rect fill="none" stroke="#ffffff"
  </text>
  <text x="170" y="1815" font-family="Courier, monospace" font-size="16" fill="#95e1d3">
    stroke-opacity="0.3"/&gt;
  </text>
  <text x="130" y="1850" font-family="Courier, monospace" font-size="16" fill="#ffe66d">
    &lt;!-- Shine overlay --&gt;
  </text>

  <!-- Tips -->
  <text x="540" y="1820" font-family="Arial, sans-serif" font-size="14"
        fill="#ffffff" opacity="0.6" text-anchor="middle">
    Key: Low opacity (10-20%) + white border + gradient shine
  </text>
</svg>
