<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Example Tapestry Visualization #1 -->

  <defs>
    <!-- Ethereal purple gradient -->
    <linearGradient id="etherealPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c39dff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9d6dff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a3dff;stop-opacity:1" />
    </linearGradient>

    <!-- Mystical cyan gradient -->
    <linearGradient id="mysticalCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>

    <!-- Ethereal glow -->
    <filter id="etherealGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Symbol glow -->
    <filter id="symbolGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="rgba(10, 14, 39, 0.8)"/>

  <!-- Tapestry visualization - showing example links -->
  <g transform="translate(400, 225)">
    <!-- Connection lines forming a web -->
    <path d="M -300,-150 Q -200,-100 0,-120 Q 200,-140 300,-100" fill="none"
          stroke="url(#etherealPurple)" stroke-width="1" opacity="0.3"/>
    <path d="M -300,-150 L -150,0" fill="none" stroke="url(#mysticalCyan)" stroke-width="1" opacity="0.3"/>
    <path d="M 300,-100 L 150,0" fill="none" stroke="url(#etherealPurple)" stroke-width="1" opacity="0.3"/>
    <path d="M -150,0 L 0,80" fill="none" stroke="url(#mysticalCyan)" stroke-width="1" opacity="0.3"/>
    <path d="M 150,0 L 0,80" fill="none" stroke="url(#etherealPurple)" stroke-width="1" opacity="0.3"/>

    <!-- Link cards/nodes -->
    <!-- Top row -->
    <g transform="translate(-300, -150)">
      <rect x="-60" y="-25" width="120" height="50" rx="8"
            fill="rgba(122, 61, 255, 0.2)" stroke="url(#etherealPurple)" stroke-width="1.5"/>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="12" fill="#c39dff" text-anchor="middle">🔗 Portfolio</text>
      <text x="0" y="10" font-family="Arial, sans-serif" font-size="10" fill="#7a3dff" text-anchor="middle" opacity="0.7">yourwork.com</text>
    </g>

    <g transform="translate(0, -120)">
      <rect x="-60" y="-25" width="120" height="50" rx="8"
            fill="rgba(0, 212, 255, 0.2)" stroke="url(#mysticalCyan)" stroke-width="1.5"/>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="12" fill="#00d4ff" text-anchor="middle">📱 Social</text>
      <text x="0" y="10" font-family="Arial, sans-serif" font-size="10" fill="#00ffff" text-anchor="middle" opacity="0.7">@yourhandle</text>
    </g>

    <g transform="translate(300, -100)">
      <rect x="-60" y="-25" width="120" height="50" rx="8"
            fill="rgba(122, 61, 255, 0.2)" stroke="url(#etherealPurple)" stroke-width="1.5"/>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="12" fill="#c39dff" text-anchor="middle">💼 LinkedIn</text>
      <text x="0" y="10" font-family="Arial, sans-serif" font-size="10" fill="#7a3dff" text-anchor="middle" opacity="0.7">professional</text>
    </g>

    <!-- Middle row -->
    <g transform="translate(-150, 0)">
      <rect x="-60" y="-25" width="120" height="50" rx="8"
            fill="rgba(0, 212, 255, 0.2)" stroke="url(#mysticalCyan)" stroke-width="1.5"/>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="12" fill="#00d4ff" text-anchor="middle">📝 Blog</text>
      <text x="0" y="10" font-family="Arial, sans-serif" font-size="10" fill="#00ffff" text-anchor="middle" opacity="0.7">writing.dev</text>
    </g>

    <g transform="translate(150, 0)">
      <rect x="-60" y="-25" width="120" height="50" rx="8"
            fill="rgba(122, 61, 255, 0.2)" stroke="url(#etherealPurple)" stroke-width="1.5"/>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="12" fill="#c39dff" text-anchor="middle">🎨 Gallery</text>
      <text x="0" y="10" font-family="Arial, sans-serif" font-size="10" fill="#7a3dff" text-anchor="middle" opacity="0.7">art.space</text>
    </g>

    <!-- Bottom center -->
    <g transform="translate(0, 80)">
      <rect x="-70" y="-28" width="140" height="56" rx="10"
            fill="rgba(0, 212, 255, 0.3)" stroke="url(#mysticalCyan)" stroke-width="2"
            filter="url(#etherealGlow)"/>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00ffff" text-anchor="middle">✨ Main Site</text>
      <text x="0" y="12" font-family="Arial, sans-serif" font-size="11" fill="#00d4ff" text-anchor="middle" opacity="0.8">mysite.com</text>
    </g>

    <!-- Glowing connection points -->
    <circle cx="-300" cy="-150" r="4" fill="url(#etherealPurple)" filter="url(#symbolGlow)"/>
    <circle cx="0" cy="-120" r="4" fill="url(#mysticalCyan)" filter="url(#symbolGlow)"/>
    <circle cx="300" cy="-100" r="4" fill="url(#etherealPurple)" filter="url(#symbolGlow)"/>
    <circle cx="-150" cy="0" r="4" fill="url(#mysticalCyan)" filter="url(#symbolGlow)"/>
    <circle cx="150" cy="0" r="4" fill="url(#etherealPurple)" filter="url(#symbolGlow)"/>
    <circle cx="0" cy="80" r="6" fill="url(#mysticalCyan)" filter="url(#symbolGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
